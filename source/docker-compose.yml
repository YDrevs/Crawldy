services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seo
      POSTGRES_PASSWORD: seo
      POSTGRES_DB: seo
    # Лише на loopback хоста: опублікований 5432 із паролем «seo» видно
    # з усієї мережі, у якій стоїть машина розробника.
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seo"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Пароль обовʼязковий: хто пише в Redis, той ставить завдання воркеру.
    # Значення — з кореневого `.env` (REDIS_PASSWORD); локальний дефолт
    # лише для `docker compose up` без налаштувань.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-crawldy-local-redis}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      retries: 10

  api:
    # Явна ціль обовʼязкова: без неї Docker збирає останній шар, тобто
    # образ із браузером, який API не потрібен.
    build:
      context: ./backend
      target: base
    env_file: [./backend/.env]
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-crawldy-local-redis}@redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes: ["./backend:/app"]

  worker:
    build:
      context: ./backend
      target: worker
    env_file: [./backend/.env]
    # Стандартний профіль seccomp забороняє user namespaces, без яких
    # sandbox Chromium не стартує. Цей профіль — стандартний плюс
    # clone/unshare/setns; альтернатива — --no-sandbox, тобто чужий JS
    # без пісочниці.
    security_opt:
      - seccomp=./deploy/seccomp/chromium.json
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-crawldy-local-redis}@redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: arq app.worker.main.WorkerSettings
    volumes: ["./backend:/app"]

  frontend:
    image: node:22-alpine
    working_dir: /app
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    volumes:
      - ./frontend:/app
      # Свої .next і node_modules у контейнера. Без цього він тримає
      # хостовий .next/trace, і `npm run build` на хості падає з EPERM,
      # а node_modules, зібрані під Windows, ламають alpine-збірку.
      - /app/.next
      - /app/node_modules
    command: sh -c "npm install && npm run dev"

volumes:
  pgdata:
