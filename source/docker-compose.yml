services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seo
      POSTGRES_PASSWORD: seo
      POSTGRES_DB: seo
    # Лише localhost: стенд розробника не має віддавати базу з паролем
    # `seo` у локальну мережу.
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seo"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Без пароля, тож лише localhost: хто пише в чергу, той керує воркером.
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    # Явна ціль обовʼязкова: без неї Docker збирає останній шар, тобто
    # образ із браузером, який API не потрібен.
    build:
      context: ./backend
      target: base
    env_file: [./backend/.env]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes: ["./backend:/app"]

  worker:
    build:
      context: ./backend
      target: worker
    env_file: [./backend/.env]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: arq app.worker.main.WorkerSettings
    volumes: ["./backend:/app"]

  frontend:
    image: node:22-alpine
    working_dir: /app
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ./frontend:/app
      # Свої .next і node_modules у контейнера. Без цього він тримає
      # хостовий .next/trace, і `npm run build` на хості падає з EPERM,
      # а node_modules, зібрані під Windows, ламають alpine-збірку.
      - /app/.next
      - /app/node_modules
    command: sh -c "npm install && npm run dev"

volumes:
  pgdata:
